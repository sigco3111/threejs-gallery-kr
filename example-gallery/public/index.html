<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Three.js 비주얼 예제 갤러리 — 한글판</title>
    <link rel="stylesheet" href="/gallery/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <svg
            class="brand-mark"
            viewBox="0 0 120 120"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            aria-hidden="true"
          >
            <ellipse cx="60" cy="26" rx="20" ry="6" />
            <ellipse cx="60" cy="43" rx="34" ry="10.2" stroke-opacity=".85" />
            <ellipse cx="60" cy="60" rx="40" ry="12" stroke-opacity=".7" />
            <ellipse cx="60" cy="77" rx="34" ry="10.2" stroke-opacity=".5" />
            <ellipse cx="60" cy="94" rx="20" ry="6" stroke-opacity=".3" />
          </svg>
          <h1>예제 갤러리</h1>
        </div>

        <div class="topbar-actions">
          <label class="search">
            <span>검색</span>
            <input
              id="search"
              type="search"
              placeholder="스킬, 효과, 기법…"
              autocomplete="off"
            />
            <kbd>⌘K</kbd>
          </label>
          <button id="refresh" class="button" type="button">
            <svg
              class="button-icon"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.35"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2.74 6.08A5.6 5.6 0 0 1 13.35 6.36" />
              <path d="M13.35 3.2v3.16h-3.15" />
              <path d="M13.26 9.92A5.6 5.6 0 0 1 2.65 9.64" />
              <path d="M2.65 12.8V9.64h3.15" />
            </svg>
            새로 고침
          </button>
          <button
            id="toggle-view"
            class="button button-primary"
            type="button"
            aria-current="true"
          >
            <svg
              class="button-icon"
              viewBox="0 0 16 16"
              stroke="currentColor"
              stroke-width="1.3"
              aria-hidden="true"
            >
              <rect x="1.65" y="1.65" width="5.4" height="5.4" rx="1.1" />
              <rect x="8.95" y="1.65" width="5.4" height="5.4" rx="1.1" />
              <rect x="1.65" y="8.95" width="5.4" height="5.4" rx="1.1" />
              <rect x="8.95" y="8.95" width="5.4" height="5.4" rx="1.1" />
            </svg>
            개요
          </button>
        </div>
      </header>

      <main class="main-layout">
        <aside class="catalog">
          <div class="catalog-heading">
            <span id="example-count">예제 0개</span>
            <span id="runtime-summary">런타임 대기</span>
          </div>
          <nav id="example-list" aria-label="예제 목록"></nav>
        </aside>

        <section class="inspection">
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-orbit" aria-hidden="true">
              <span></span>
            </div>
            <p class="eyebrow">등록된 비주얼 시스템이 없습니다</p>
            <h2>아무 스킬의 <code>examples/</code> 디렉토리에 예제를 추가하세요.</h2>
            <p>
              디렉토리에 <code>index.html</code> 과 <code>example.json</code> 이 있으면 갤러리가 자동으로 인식합니다.
            </p>
          </div>

          <div id="single-view" class="single-view" hidden>
            <div class="toolbar" aria-label="예제 컨트롤" hidden>
              <label>
                뷰포트
                <select id="viewport">
                  <option value="responsive">반응형</option>
                  <option value="default">예제 기본값</option>
                  <option value="1920x1080">1920 × 1080</option>
                  <option value="1440x900">1440 × 900</option>
                  <option value="1280x720">1280 × 720</option>
                  <option value="834x1194">834 × 1194</option>
                  <option value="390x844">390 × 844</option>
                </select>
              </label>
              <label>
                DPR
                <select id="dpr">
                  <option value="0.75">0.75</option>
                  <option value="1">1</option>
                  <option value="1.5">1.5</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
              </label>
              <label>
                시간
                <select id="time-scale">
                  <option value="0.25">0.25×</option>
                  <option value="0.5">0.5×</option>
                  <option value="1">1×</option>
                  <option value="2">2×</option>
                </select>
              </label>
              <label id="debug-control" hidden>
                디버그
                <select id="debug-mode"></select>
              </label>
              <button id="pause" class="button" type="button">일시정지</button>
              <button id="reload" class="button" type="button">다시 불러오기</button>
              <button id="capture" class="button" type="button">캡쳐</button>
              <a id="standalone" class="button" target="_blank" rel="noreferrer">
                단독 열기
              </a>
            </div>

            <div class="stage-shell">
              <div id="stage" class="stage">
                <iframe
                  id="example-frame"
                  title="선택한 Three.js 예제"
                  allow="fullscreen"
                ></iframe>
              </div>
              <div class="stage-status">
                <span id="frame-status" data-state="idle">대기</span>
                <span id="frame-metrics"></span>
                <span id="frame-size"></span>
              </div>
            </div>
          </div>

          <div id="overview" class="overview" hidden></div>
        </section>
      </main>
    </div>

    <script type="module" src="/gallery/app.js"></script>
  </body>
</html>
